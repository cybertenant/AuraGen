services:
  postgres:
    image: postgres:16-alpine
    container_name: auragen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: auragen_db
    ports:
      - "5432:5432"
    volumes:
      - auragen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d auragen_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auragen_pgdata:
